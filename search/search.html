<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Vault - 智能搜索</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <h1>Knowledge Vault</h1>
        <span class="subtitle">知识库搜索</span>
      </div>
      <div class="header-center">
        <nav class="sub-tabs">
          <button class="sub-tab-btn active" data-sub-tab="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
            资料搜索
          </button>
          <button class="sub-tab-btn" data-sub-tab="projects">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            项目集
          </button>
          <button class="sub-tab-btn" data-sub-tab="outlines">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            我的提纲
          </button>
        </nav>
      </div>
      <div class="header-right">
        <button class="btn-outline" id="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          返回
        </button>
      </div>
    </header>

    <div class="main-content">
      <aside class="sidebar">
        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="搜索关键词..." class="search-input">
        </div>

        <div class="filters">
          <div class="filter-section">
            <h3>按主题筛选</h3>
            <div class="topics-filter" id="topics-filter"></div>
          </div>

          <div class="filter-section">
            <h3>按标签筛选</h3>
            <div class="tags-filter" id="tags-filter"></div>
          </div>

          <div class="filter-section">
            <h3>按来源筛选</h3>
            <div class="sources-filter" id="sources-filter"></div>
          </div>

          <div class="filter-section">
            <h3>按时间筛选</h3>
            <div class="date-filter">
              <div class="date-input-group">
                <label>开始日期</label>
                <input type="date" id="date-start" class="input">
              </div>
              <div class="date-input-group">
                <label>结束日期</label>
                <input type="date" id="date-end" class="input">
              </div>
              <div class="date-presets">
                <button class="preset-btn" data-days="7">最近7天</button>
                <button class="preset-btn" data-days="30">最近30天</button>
                <button class="preset-btn" data-days="90">最近90天</button>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <h3>按可信度筛选</h3>
            <div class="credibility-filter">
              <label class="checkbox-item">
                <input type="checkbox" value="high" class="credibility-checkbox">
                <span class="credibility-badge credibility-high">高可信度</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="neutral" class="credibility-checkbox">
                <span class="credibility-badge credibility-neutral">一般</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="low" class="credibility-checkbox">
                <span class="credibility-badge credibility-low">待验证</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" value="unreliable" class="credibility-checkbox">
                <span class="credibility-badge credibility-unreliable">不可靠</span>
              </label>
            </div>
          </div>

          <button class="btn-reset" id="btn-reset-filters">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            重置筛选
          </button>
        </div>
      </aside>

      <main class="content">
        <div class="sub-tab-panel active" id="sub-tab-search">
          <div class="content-header">
            <div class="results-info">
              <span id="results-count">0</span> 条结果
              <span id="active-filters" class="active-filters"></span>
            </div>
            <div class="content-actions">
              <button class="btn-outline" id="btn-select-all">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <polyline points="9 11 12 14 22 4"/>
                </svg>
                全选
              </button>
              <button class="btn-outline" id="btn-add-to-project" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                  <line x1="12" y1="11" x2="12" y2="17"/>
                  <line x1="9" y1="14" x2="15" y2="14"/>
                </svg>
                添加到项目集
              </button>
              <button class="btn-primary" id="btn-create-outline" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6"/>
                  <line x1="8" y1="12" x2="21" y2="12"/>
                  <line x1="8" y1="18" x2="21" y2="18"/>
                  <line x1="3" y1="6" x2="3.01" y2="6"/>
                  <line x1="3" y1="12" x2="3.01" y2="12"/>
                  <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                整理提纲
              </button>
            </div>
          </div>

          <div class="clips-grid" id="clips-grid"></div>

          <div class="empty-state" id="empty-state" style="display: none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
            <h3>没有找到匹配的内容</h3>
            <p>尝试调整搜索关键词或筛选条件</p>
          </div>
        </div>

        <div class="sub-tab-panel" id="sub-tab-projects">
          <div class="content-header">
            <div class="results-info">
              <span id="projects-count">0</span> 个项目集
            </div>
            <div class="content-actions">
              <button class="btn-primary" id="btn-create-project">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                  <line x1="12" y1="11" x2="12" y2="17"/>
                  <line x1="9" y1="14" x2="15" y2="14"/>
                </svg>
                新建项目集
              </button>
            </div>
          </div>

          <div class="projects-grid" id="projects-grid"></div>

          <div class="project-detail-view" id="project-detail-view" style="display: none;">
            <div class="content-header">
              <div class="results-info">
                <button class="btn-outline small" id="btn-back-to-projects">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                  </svg>
                  返回
                </button>
                <span id="project-detail-title"></span>
              </div>
              <div class="content-actions">
                <button class="btn-outline" id="btn-edit-project">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                  编辑
                </button>
                <button class="btn-primary" id="btn-generate-project-summary">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                  </svg>
                  生成汇总
                </button>
              </div>
            </div>
            <div class="project-detail-body">
              <div class="project-notes-section">
                <h4>项目备注</h4>
                <p id="project-detail-notes" class="project-notes"></p>
              </div>
              <div class="project-clips-section">
                <h4>包含资料 (<span id="project-detail-count">0</span>)</h4>
                <p class="hint">拖拽调整资料顺序</p>
                <div class="project-clips-list" id="project-clips-list"></div>
              </div>
            </div>
          </div>

          <div class="empty-state" id="projects-empty-state" style="display: none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <h3>还没有项目集</h3>
            <p>创建项目集来组织和整理你的资料</p>
          </div>
        </div>

        <div class="sub-tab-panel" id="sub-tab-outlines">
          <div class="content-header">
            <div class="results-info">
              <span id="outlines-count">0</span> 个提纲
            </div>
          </div>

          <div class="outlines-list" id="outlines-list"></div>

          <div class="empty-state" id="outlines-empty-state" style="display: none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <h3>还没有提纲</h3>
            <p>在资料搜索中选择多条内容来创建提纲</p>
          </div>
        </div>
      </main>
    </div>

    <div class="detail-modal" id="detail-modal">
      <div class="detail-modal-content">
        <div class="detail-modal-header">
          <h2 id="detail-title">资料详情</h2>
          <button class="icon-btn" id="btn-close-detail" title="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="detail-modal-body" id="detail-body">
        </div>
      </div>
    </div>

    <div class="modal" id="project-modal" style="display: none;">
      <div class="modal-backdrop" data-close="modal"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="project-modal-title">新建项目集</h2>
          <button class="icon-btn" data-close="modal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>项目集名称</label>
            <input type="text" id="project-name" placeholder="例如：AI研究、客户资料包" class="input">
          </div>
          <div class="form-group">
            <label>描述</label>
            <textarea id="project-description" rows="3" placeholder="简单描述这个项目集的用途..." class="textarea"></textarea>
          </div>
          <div class="form-group">
            <label>项目备注</label>
            <textarea id="project-notes" rows="4" placeholder="记录项目相关的笔记、想法..." class="textarea"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" data-close="modal">取消</button>
          <button class="btn-primary" id="btn-save-project">保存</button>
        </div>
      </div>
    </div>

    <div class="modal" id="add-to-project-modal" style="display: none;">
      <div class="modal-backdrop" data-close="modal"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>添加到项目集</h2>
          <button class="icon-btn" data-close="modal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="hint" id="add-to-project-hint">选择要添加到的项目集（共选中 0 条资料）</p>
          <div class="project-select-list" id="project-select-list"></div>
          <button class="btn-outline full-width" id="btn-create-project-inline">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="11" x2="12" y2="17"/>
              <line x1="9" y1="14" x2="15" y2="14"/>
            </svg>
            新建项目集
          </button>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" data-close="modal">取消</button>
          <button class="btn-primary" id="btn-confirm-add-to-project" disabled>添加</button>
        </div>
      </div>
    </div>

    <div class="modal" id="outline-modal" style="display: none;">
      <div class="modal-backdrop" data-close="modal"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>整理提纲</h2>
          <button class="icon-btn" data-close="modal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>提纲标题</label>
            <input type="text" id="outline-title" placeholder="输入提纲标题..." class="input">
          </div>
          <div class="outline-items" id="outline-items">
            <p class="hint">拖拽调整顺序，点击移除不想要的条目</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" data-close="modal">取消</button>
          <button class="btn-primary" id="btn-generate-markdown">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            生成 Markdown
          </button>
          <button class="btn-primary" id="btn-save-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            保存提纲
          </button>
        </div>
      </div>
    </div>

    <div class="modal" id="markdown-modal" style="display: none;">
      <div class="modal-backdrop" data-close="modal"></div>
      <div class="modal-content large">
        <div class="modal-header">
          <h2>Markdown 预览</h2>
          <button class="icon-btn" data-close="modal">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="markdown-preview" id="markdown-preview"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" data-close="modal">关闭</button>
          <button class="btn-primary" id="btn-copy-markdown">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制 Markdown
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="search.js"></script>
</body>
</html>
