<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <h1>Knowledge Vault</h1>
      </div>
    </header>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-value" id="total-clips">0</span>
        <span class="stat-label">剪藏</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="total-tags">0</span>
        <span class="stat-label">标签</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="read-later-count">0</span>
        <span class="stat-label">稍后读</span>
      </div>
    </div>

    <div class="quick-actions">
      <button class="action-btn primary" id="btn-save-clip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        快速剪藏
      </button>
      <button class="action-btn" id="btn-read-later">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        稍后阅读
      </button>
      <button class="action-btn" id="btn-capture">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        截取页面
      </button>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>最近剪藏</h2>
        <button class="link-btn" id="btn-view-all">查看全部</button>
      </div>
      <div class="recent-list" id="recent-list"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>快捷入口</h2>
      </div>
      <div class="shortcuts">
        <div class="shortcut-item">
          <span class="shortcut-key">Ctrl+Shift+S</span>
          <span class="shortcut-desc">剪藏当前页面</span>
        </div>
        <div class="shortcut-item">
          <span class="shortcut-key">Ctrl+Shift+K</span>
          <span class="shortcut-desc">打开侧边栏</span>
        </div>
        <div class="shortcut-item">
          <span class="shortcut-key">Ctrl+Shift+R</span>
          <span class="shortcut-desc">添加稍后阅读</span>
        </div>
      </div>
    </div>

    <footer class="footer">
      <button class="footer-btn" id="btn-open-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        搜索
      </button>
      <button class="footer-btn" id="btn-open-sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
        侧边栏
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
